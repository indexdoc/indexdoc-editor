<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indexdoc</title>
    <link href="../client/public/static/css/layui.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background-color: #f0f2f5;
        }

        /* 侧边栏样式 */
        .sidebar {
            position: fixed;
            left: 0;
            height: 100%;
            width: 76px;
            background-color: rgb(235 235 235);
            transition: all 0.3s;
            z-index: 1000;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        /* 导航栏样式 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            z-index: 999;
        }

        .sidebar.collapsed+.navbar {
            left: 80px;
        }

        /* 内容区域样式 */
        .content {
            margin-left: 76px;
            height: calc(100vh - 3.5px);
            transition: all 0.3s;
        }

        .sidebar.collapsed+.navbar+.content {
            margin-left: 80px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
        }

        /* 菜单项样式 */
        .menu-item {
            color: rgb(89 89 89);
            display: flex;
            flex-direction: column;
            /* 图标在上，文字在下 */
            align-items: center;
            /* 水平居中 */
            justify-content: center;
            padding: 5px 0;
            text-decoration: none;
            font-size: 14px;
            border-radius: 8px;
            margin: 5px;
        }

        .menu-item:hover {
            color: rgb(60 120 251);
            background-color: rgb(255 255 255);
        }

        .menu-item.active {
            color: rgb(60 120 251);
            background-color: rgb(255 255 255);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .menu-item .layui-icon {
            font-size: 15px;
        }

        .menu-item span {
            display: block;
            font-size: 11px;
            line-height: 1.2;
        }

        /* 功能按钮样式 */
        .nav-button {
            padding: 8px 12px;
            border: none;
            background: none;
            cursor: pointer;
            position: relative;
        }

        .nav-button:hover::after {
            content: attr(data-title);
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
        }

        .toggle-btn {
            font-size: 20px;
            color: #666;
        }

        .bottom-item {
            width: 50px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
        }



        .loading-content {
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 18px;
        }

        .menu-item span {
            text-align: center;
            font-size: 12px;
            line-height: 1.2;
        }


    </style>
</head>

<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <nav>
            <a class="menu-item" data-href="/client/public/cherry_markdown/markdown.html" data-login="false"
                data-name="MarkDown编辑器" onclick="changePage(this)">
                <i class="layui-icon layui-icon-read" style="font-size: 17px;"></i>
                <span>MarkDown编辑器</span>
            </a>
        </nav>
    </aside>
    <!-- 内容区域 -->
    <div class="content">
        <iframe id="MarkDown编辑器" src="" style="display: block"></iframe>
    </div>


    <script>
        // 切换页面内容
        async function changePage(link) {
            event.preventDefault(); // 阻止 <a> 默认跳转
            let needLogin = link.getAttribute('data-login') === 'true';
            if (needLogin) {
                // 未登录直接弹登录
                if (!isLoggedIn()) {
                    let res = await showLogin();
                    if (!res) return; // 用户关闭登录框
                } else {
                    // 登录了就再验证 token
                    let valid = await verifyLoginToken();
                    if (!valid) {
                        let res = await showLogin();
                        if (!res) return;
                    }
                }
            }
            const name = link.getAttribute('data-name');
            const href = link.getAttribute('href') || link.getAttribute('data-href');
           
            // // 到这里说明验证通过，可以切换 active
            document.querySelectorAll('.content iframe').forEach(f => f.style.display = 'none');

            // 显示目标 iframe
            let iframe = document.getElementById(name);
            iframe.style.display = 'block'
            // iframe.src = href;
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            link.classList.add('active');
        }

        window.addEventListener('pywebviewready', function () {
            loadIframe();
        });

        function loadIframe() {
            const iframeMap = {
                "MarkDown编辑器": "/client/public/cherry_markdown/markdown.html",
            };

            for (const id in iframeMap) {
                const iframe = document.getElementById(id);
                iframe.src = iframeMap[id];
            }
        }

        // 禁用 F12、Ctrl+Shift+I、Ctrl+Shift+C
        document.addEventListener('keydown', function (e) {
            // 禁用 F12
            if (e.key === "F12") {
                e.preventDefault();
                e.stopPropagation();
            }

            // 禁用 Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase())) {
                e.preventDefault();
                e.stopPropagation();
            }

            // 禁用 Ctrl+U（查看源码）
            if (e.ctrlKey && e.key.toUpperCase() === "U") {
                e.preventDefault();
                e.stopPropagation();
            }
        });
    </script>
</body>

</html>
